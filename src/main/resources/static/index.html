<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Frontend 2.0</title>
</head>
<body>

<h2>Работа с данными</h2>

<input type="text" id="dataInput" placeholder="Введите текст">
<button onclick="sendData()">Отправить</button>

<p id="sendResult"></p>

<br>

<input type="text" id="resultField" placeholder="Здесь появятся данные" readonly>
<button onclick="getData()">Получить данные</button>

<script>
    function sendData() {
        const data = document.getElementById("dataInput").value;

        fetch("http://localhost:8080/data", {
            method: "POST",
            headers: {
                "Content-Type": "text/plain"
            },
            body: data
        })
        .then(response => response.text())
        .then(result => {
            document.getElementById("sendResult").textContent = result;
        })
        .catch(error => {
            document.getElementById("sendResult").textContent = "Ошибка: " + error;
        });
    }

    function getData() {
        fetch("http://localhost:8080/data")
            .then(response => response.text())
            .then(result => {
                document.getElementById("resultField").value = result;
            })
            .catch(error => {
                document.getElementById("resultField").value = "Ошибка: " + error;
            });
    }
</script>

</body>
</html>
